<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宁予 · 简历 / Ning Yu · CV</title>
<meta name="description" content="宁予（Ning Yu）— 大连理工大学计算机硕士，研究方向：具身智能、灵巧手触觉感知、强化学习与模仿学习。">
<meta property="og:title" content="宁予 · 简历 / Ning Yu · CV">
<meta property="og:description" content="具身智能 · 灵巧手触觉感知 · 强化学习与模仿学习">
<link rel="icon" href="https://ny-wakeup.github.io/myblog/favicon/icon.jpg">
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --text:#111315; --muted:#6b7280;
    --line:#e4e7ec; --shadow:0 8px 28px rgba(17,19,21,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1013; --surface:#161a1f; --text:#e9ecef; --muted:#9aa1a9;
      --line:#252b33; --shadow:0 8px 28px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  header{
    flex:none; position:relative; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1040px; margin:0 auto; padding:12px 20px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .who{display:flex; flex-direction:column; line-height:1.3}
  .who b{font-size:15px; font-weight:650; letter-spacing:.02em}
  .who small{color:var(--muted); font-size:11.5px; margin-top:2px}
  .spacer{flex:1}
  .switch{
    display:inline-flex; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:3px; gap:2px;
  }
  .switch button{
    appearance:none; border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:13px; line-height:1; padding:8px 16px; border-radius:999px;
    cursor:pointer; transition:background .18s ease, color .18s ease;
  }
  .switch button:hover{color:var(--text)}
  .switch button[aria-pressed="true"]{background:var(--text); color:var(--surface)}
  .switch button[aria-pressed="true"]:hover{color:var(--surface)}
  .dl{
    font-size:12.5px; color:var(--muted); text-decoration:none;
    border:1px solid var(--line); background:var(--surface);
    border-radius:999px; padding:8px 14px; transition:color .18s ease, border-color .18s ease;
  }
  .dl:hover{color:var(--text); border-color:var(--muted)}
  main{
    flex:1; min-height:0; display:flex;
    max-width:1040px; width:100%; margin:0 auto; padding:14px 20px 0;
  }
  .frame{
    flex:1; min-height:0; display:flex;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:var(--shadow);
  }
  iframe{display:block; flex:1; width:100%; height:100%; min-height:0; border:0}
  .hint{
    flex:none; max-width:1040px; width:100%; margin:0 auto;
    padding:10px 22px 14px; color:var(--muted); font-size:12px; line-height:1.5;
  }
  .hint a{color:var(--muted)}
  @media (max-width:640px){
    .who small{display:none}
    .bar{padding:10px 14px}
    main{padding:10px 12px 0}
    .hint{padding:8px 14px 12px; font-size:11px}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="who">
      <b>宁予 · Ning Yu</b>
      <small>具身智能 · 灵巧手触觉感知 · 强化学习与模仿学习</small>
    </div>
    <div class="spacer"></div>
    <div class="switch" role="group" aria-label="切换语言 / Switch language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
    <a class="dl" id="dl" href="cv/resume-zh.pdf" download>下载 PDF</a>
  </div>
</header>

<main>
  <div class="frame">
    <iframe id="viewer" src="cv/resume-zh.pdf" title="简历 / CV"></iframe>
  </div>
</main>

<p class="hint">
  如果 PDF 没有正常显示，可以直接打开：
  <a id="raw-zh" href="cv/resume-zh.pdf">中文版</a> ·
  <a id="raw-en" href="cv/resume-en.pdf">English version</a>
</p>

<script>
(function(){
  var files = {
    zh: { src: 'cv/resume-zh.pdf', label: '下载 PDF' },
    en: { src: 'cv/resume-en.pdf', label: 'Download PDF' }
  };
  var viewer = document.getElementById('viewer');
  var dl = document.getElementById('dl');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.switch button'));

  function apply(lang){
    var f = files[lang] || files.zh;
    viewer.src = f.src;
    dl.href = f.src;
    dl.textContent = f.label;
    document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-CN';
    buttons.forEach(function(b){
      b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
    });
    if (history.replaceState) {
      history.replaceState(null, '', lang === 'en' ? '#en' : '#zh');
    }
  }

  buttons.forEach(function(b){
    b.addEventListener('click', function(){ apply(b.dataset.lang); });
  });

  if (location.hash === '#en') apply('en');
})();
</script>
</body>
</html>
