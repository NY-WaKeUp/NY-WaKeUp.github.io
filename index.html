<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宁予 · CV</title>
<style>
  html, body { height: 100%; margin: 0; background: #f4f5f7; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  .lang {
    position: fixed; top: 60px; right: 16px; z-index: 9;
    display: flex; gap: 2px; padding: 3px; border-radius: 999px;
    background: rgba(255, 255, 255, .76);
    -webkit-backdrop-filter: saturate(160%) blur(10px);
    backdrop-filter: saturate(160%) blur(10px);
    border: 1px solid rgba(17, 19, 21, .07);
    box-shadow: 0 2px 10px rgba(17, 19, 21, .07);
  }
  .lang button {
    appearance: none; border: 0; background: none; margin: 0;
    font: inherit; font-size: 12px; line-height: 1; letter-spacing: .02em;
    padding: 7px 13px; border-radius: 999px; color: #767c85;
    cursor: pointer; transition: background .18s ease, color .18s ease;
  }
  .lang button:hover { color: #111315; }
  .lang button[aria-pressed="true"] { background: #1f2328; color: #fff; }
  .lang button[aria-pressed="true"]:hover { color: #fff; }

  @media (max-width: 640px) {
    .lang { top: 56px; right: 10px; }
    .lang button { padding: 7px 11px; }
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #0e1013; }
    .lang {
      background: rgba(28, 32, 38, .72);
      border-color: rgba(255, 255, 255, .08);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .45);
    }
    .lang button { color: #9aa1a9; }
    .lang button:hover { color: #e9ecef; }
    .lang button[aria-pressed="true"] { background: #e9ecef; color: #111315; }
    .lang button[aria-pressed="true"]:hover { color: #111315; }
  }
</style>
</head>
<body>

<iframe id="viewer" src="cv/resume-zh.pdf" title="CV"></iframe>

<div class="lang" role="group" aria-label="语言 / Language">
  <button type="button" data-lang="zh" aria-pressed="true">中文</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>

<script>
(function () {
  var src = {
    zh: 'cv/resume-zh.pdf',
    en: 'cv/resume-en.pdf'
  };
  var viewer = document.getElementById('viewer');
  var buttons = [].slice.call(document.querySelectorAll('.lang button'));

  function apply(lang) {
    if (!src[lang]) lang = 'zh';
    viewer.src = src[lang];
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
    });
    if (history.replaceState) history.replaceState(null, '', '#' + lang);
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.lang); });
  });

  if (location.hash === '#en') apply('en');
})();
</script>

</body>
</html>
